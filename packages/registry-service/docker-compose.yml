services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness-local
      POSTGRES_DB: harness_registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness_registry"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - registry-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: harness
      MINIO_ROOT_PASSWORD: harness-local-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - registry-minio:/data

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 harness harness-local-secret && mc mb --ignore-existing local/harness-artifacts"]

  registry:
    build:
      context: ../..
      dockerfile: packages/registry-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      PORT: "4810"
      PUBLIC_BASE_URL: http://localhost:4810
      DATABASE_URL: postgresql://harness:harness-local@postgres:5432/harness_registry
      MIGRATE_ON_START: "true"
      S3_BUCKET: harness-artifacts
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: harness
      S3_SECRET_ACCESS_KEY: harness-local-secret
      CONTRACT_BOOTSTRAP_SECRET: harness-contract-local
      WEB_ORIGIN: http://localhost:4174
      CLIENT_ORIGINS: tauri://localhost,http://tauri.localhost,http://localhost:1420
    ports:
      - "4810:4810"

  admin:
    build:
      context: ../..
      dockerfile: apps/admin-console/Dockerfile
    depends_on:
      - registry
    ports:
      - "4174:4174"

volumes:
  registry-postgres:
  registry-minio:
