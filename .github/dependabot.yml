version: 2
updates:
  # GitHub Actions — weekly is fine, these move slowly
  # Every entry waits `cooldown` days after a release before Dependabot proposes it.
  # Hijacked releases are usually caught and pulled within days, so the wait keeps them
  # out. Security updates ignore the cooldown and the schedule.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Root pnpm workspace — covers ALL workspace packages via the shared root lockfile,
  # including website/ (a member of pnpm-workspace.yaml: apps/*, packages/*, website).
  # website has NO lockfile of its own — pnpm resolves it against the root lockfile —
  # so website is intentionally NOT a separate npm ecosystem. Adding one produces
  # broken PRs that touch website/package.json without updating the root lock. A
  # stray website/pnpm-lock.yaml also silently re-arms ~18 phantom security alerts
  # against versions the build never installs; don't reintroduce it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  # Rust / Tauri desktop
  # Groups hold minor and patch only, so a major bump arrives as its own PR and
  # never rides along inside an auto-merged group.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python evals — weekly, low churn
  - package-ecosystem: "pip"
    directory: "/evals"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images (both Dockerfiles use floating tags like node:22-alpine, so
  # this only moves the pinned minor, e.g. nginx 1.29 -> 1.30). Monthly, one PR.
  # The auto-merge workflow skips this ecosystem; a human merges these.
  - package-ecosystem: "docker"
    directories:
      - "/apps/admin-console"
      - "/packages/registry-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
